name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sdk:
    name: SDK (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @tracebee/sdk typecheck
      - run: pnpm --filter @tracebee/sdk test
      - run: pnpm --filter @tracebee/sdk build

  web:
    name: Web (typecheck, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
